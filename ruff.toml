# Lint gate for CI. Deliberately narrow: syntax errors and undefined names
# (real bugs), not style. Widen it in a dedicated clean-up change, not as a
# side effect of feature work. Python 3.10 is the user's interpreter.
target-version = "py310"
extend-exclude = ["legacy", "apps/vscode-extension/dist"]

[lint]
select = ["E9", "F63", "F7", "F82"]
