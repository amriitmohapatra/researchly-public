# ml/realdocs/manifest.yaml - real-document test bench (P29; seeds S5a)
#
# One entry per document. Text is fetched at run time in CI; never committed.
# Only metadata lives here (ids, titles, licences, evidence) - no article text,
# abstracts or excerpts. Registry entries: ml/datasets.yaml (realdocs-*).
# Human summary, queries and exclusions: ml/realdocs/SOURCES.md.
#
# Built 2026-10-03 by the corpus builder. Licence rule (ml/datasets.yaml, D2):
#   CC-BY-* / CC0-1.0     -> permitted_use [ci_eval, train_experimental]
#   any NC or ND licence  -> [ci_eval] only
#   test-file (software-repo test documents) -> [ci_eval] only
#
# discipline vocabulary: epidemiology (infectious-disease epidemiology and
#   modelling), public-health, clinical-medicine, molecular-biology,
#   ecology-evolution, physical-earth-sciences, engineering,
#   computational-statistics, social-sciences, humanities, none
#
# URL patterns the harness must handle:
#   europepmc jats   .../rest/{PMCID}/fullTextXML -> JATS XML (application/xml)
#   europepmc docx   .../rest/{PMCID}/supplementaryFiles -> a ZIP of all
#                    supplementary files; extract the members matching notes "pick:"
#   biorxiv/medrxiv  jatsxml URL from the bioRxiv API (.../content/early/.../*.source.xml)
#   github latex     https://github.com/{owner}/{repo}/archive/{sha}.tar.gz ->
#                    gzip tarball, top-level dir {repo}-{sha}/; main file in notes "main:"
#   github docx      raw.githubusercontent.com/{owner}/{repo}/{sha}/{path} -> the file

